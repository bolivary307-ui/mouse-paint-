<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mouse Paint: Mix & Discover!</title>


<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        "Arial Rounded MT Bold",
        "Trebuchet MS",
        Arial,
        sans-serif;

    color: #244a72;

    background-image:
        url("https://i.postimg.cc/Z5DmsXKk/imagen-fondo.png");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    background-attachment: fixed;
}


/* =====================================================
   MAIN GAME
===================================================== */

.game {

    width: 100%;

    max-width: 1150px;

    margin: auto;

    padding: 20px;

    text-align: center;
}


/* =====================================================
   TITLE
===================================================== */

header {

    padding: 5px 10px 10px;
}

h1 {

    margin: 0;

    font-size:
        clamp(38px, 6vw, 64px);

    color: #e84c3d;

    text-shadow:
        2px 3px 0 #ffd34e;
}

.subtitle {

    font-size:
        clamp(23px, 4vw, 37px);

    font-weight: 900;

    color: #245a91;
}


/* =====================================================
   CHALLENGE
===================================================== */

.challenge {

    max-width: 750px;

    margin:
        12px auto 18px;

    padding:
        16px 22px;

    background:
        rgba(255,255,255,.95);

    border-radius:
        28px;

    box-shadow:
        0 6px 14px rgba(0,0,0,.14);
}


.challenge-small {

    font-size: 20px;

    font-weight: 800;

    margin-bottom: 3px;
}


.challenge-color {

    font-size:
        clamp(30px, 5vw, 48px);

    font-weight: 900;

    letter-spacing: 2px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    flex-wrap: wrap;
}

.speak-btn {
    background: #ffd34e;
    border: none;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    transition: transform 0.2s;
}

.speak-btn:hover {
    transform: scale(1.1);
}

.level-indicator {
    font-size: 15px;
    font-weight: 800;
    color: #607d9a;
    margin-bottom: 6px;
}


/* =====================================================
   SCORE
===================================================== */

.score {

    display: inline-block;

    padding:
        8px 20px;

    margin-bottom: 18px;

    background:
        rgba(255,255,255,.95);

    border-radius: 20px;

    font-size: 23px;

    font-weight: 900;

    box-shadow:
        0 4px 10px rgba(0,0,0,.12);
}


/* =====================================================
   MICE
===================================================== */

.mice {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 20px;

    margin:
        5px auto 25px;
}


.mouse-card {

    border: none;

    border-radius: 30px;

    padding:
        10px 10px 20px;

    background:
        rgba(255,255,255,.97);

    cursor: grab;

    min-height: 335px;

    box-shadow:
        0 7px 16px rgba(0,0,0,.16);

    transition:
        transform .18s,
        box-shadow .18s;
}


.mouse-card:hover {

    transform:
        translateY(-6px)
        scale(1.02);

    box-shadow:
        0 11px 22px rgba(0,0,0,.21);
}


.mouse-card:active {

    cursor: grabbing;

    transform:
        scale(.96);
}


.mouse-card img {

    width:
        min(185px, 90%);

    height: 175px;

    object-fit: contain;

    display: block;

    margin: auto;
}


/* =====================================================
   COLOR NAMES
===================================================== */

.mouse-name {

    font-size: 29px;

    font-weight: 900;

    margin-top: 4px;

    letter-spacing: 1px;
}


.red-text {
    color: #e53935;
}

.yellow-text {
    color: #d69d00;
}

.blue-text {
    color: #1976d2;
}


/* =====================================================
   BIG COLOR BALLS
===================================================== */

.color-ball {

    width: 75px;

    height: 75px;

    border-radius: 50%;

    margin:
        12px auto 0;

    border:
        6px solid white;

    box-shadow:
        0 5px 12px rgba(0,0,0,.25);

    transition:
        transform .2s;
}


.mouse-card:hover
.color-ball {

    transform:
        scale(1.12);
}


.red-ball {

    background:
        #e53935;
}


.yellow-ball {

    background:
        #fbc02d;
}


.blue-ball {

    background:
        #42a5f5;
}


/* =====================================================
   MIX AREA
===================================================== */

.mix-panel {

    background:
        rgba(238,248,255,.96);

    border:
        5px solid #a9dcff;

    border-radius:
        35px;

    padding:
        24px;

    box-shadow:
        0 8px 18px rgba(0,0,0,.12);
}


h2 {

    margin:
        0 0 18px;

    font-size:
        clamp(27px, 4vw, 40px);
}


/* =====================================================
   DROP ZONES
===================================================== */

.mix-slots {

    display: flex;

    justify-content:
        center;

    align-items:
        center;

    gap: 20px;

    flex-wrap: wrap;

    margin-bottom: 10px;
}


.drop-zone {

    width: 165px;

    height: 165px;

    border:
        5px dashed #8da0b2;

    border-radius: 50%;

    background:
        rgba(255,255,255,.9);

    display: flex;

    justify-content:
        center;

    align-items:
        center;

    font-size: 18px;

    font-weight: 900;

    transition:
        .2s;
}


.drop-zone.drag-over {

    transform:
        scale(1.08);

    border:
        5px solid #ff9b35;

    background:
        #fff4df;
}


.drop-zone.filled {

    border-style:
        solid;

    color:
        white;

    text-shadow:
        1px 2px 3px rgba(0,0,0,.25);
}


.plus {

    font-size:
        45px;

    font-weight:
        900;
}


/* =====================================================
   MIX BUTTON
===================================================== */

.mix-button {

    border: none;

    border-radius: 23px;

    padding:
        16px 38px;

    margin-top:
        20px;

    font-size:
        26px;

    font-weight:
        900;

    color:
        white;

    background:
        #ff8a28;

    cursor:
        pointer;

    box-shadow:
        0 5px 10px rgba(0,0,0,.17);

    transition:
        transform .15s;
}


.mix-button:hover {

    transform:
        scale(1.06);
}


/* =====================================================
   RESULT
===================================================== */

.result {

    max-width:
        650px;

    min-height:
        175px;

    margin:
        22px auto 5px;

    padding:
        18px;

    background:
        rgba(255,255,255,.98);

    border-radius:
        27px;

    box-shadow:
        0 5px 12px rgba(0,0,0,.09);
}


.result-title {

    font-size:
        21px;

    font-weight:
        800;
}


.result-splash {

    width:
        85px;

    height:
        85px;

    border-radius:
        50%;

    margin:
        10px auto;

    display:
        none;

    box-shadow:
        0 5px 12px rgba(0,0,0,.2);
}


.result-name {

    font-size:
        38px;

    font-weight:
        900;
}


.spoken {

    font-size:
        20px;

    font-weight:
        800;

    margin-top:
        8px;
}


.feedback {

    min-height:
        35px;

    margin-top:
        10px;

    font-size:
        24px;

    font-weight:
        900;
}


/* =====================================================
   NEXT BUTTON
===================================================== */

.next-button {

    display:
        none;

    border:
        none;

    border-radius:
        22px;

    padding:
        15px 32px;

    margin-top:
        15px;

    background:
        #58b957;

    color:
        white;

    font-size:
        23px;

    font-weight:
        900;

    cursor:
        pointer;

    box-shadow:
        0 5px 10px rgba(0,0,0,.15);
}


.next-button:hover {

    transform:
        scale(1.05);
}


/* =====================================================
   RESET
===================================================== */

.reset-button {

    border:
        none;

    border-radius:
        20px;

    padding:
        12px 25px;

    margin-top:
        15px;

    background:
        #607d9a;

    color:
        white;

    font-size:
        18px;

    font-weight:
        900;

    cursor:
        pointer;
}


/* =====================================================
   CONFETTI / PARTICLE ANIMATION
===================================================== */
@keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
}

.particle {
    position: fixed;
    top: -20px;
    font-size: 24px;
    pointer-events: none;
    animation: fall 2s linear forwards;
    z-index: 9999;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 650px) {

    .game {

        padding:
            10px;
    }


    .mice {

        gap:
            8px;
    }


    .mouse-card {

        min-height:
            230px;

        padding:
            7px;
    }


    .mouse-card img {

        height:
            115px;
    }


    .mouse-name {

        font-size:
            19px;
    }


    .color-ball {

        width:
            58px;

        height:
            58px;
    }


    .drop-zone {

        width:
            125px;

        height:
            125px;
    }


    .plus {

        font-size:
            30px;
    }

}

</style>

</head>


<body>


<div class="game">


<!-- =====================================================
     TITLE
===================================================== -->

<header>

    <h1>
        🐭 Mouse Paint
    </h1>

    <div class="subtitle">
        Mix & Discover!
    </div>

</header>


<!-- =====================================================
     CHALLENGE
===================================================== -->

<div class="challenge">

    <div id="levelIndicator" class="level-indicator">
        Level 1 of 5
    </div>

    <div class="challenge-small">
        🎨 Your challenge:
    </div>

    <div class="challenge-color">
        <span id="challengeColor">CAN YOU MAKE ORANGE?</span>
        <button class="speak-btn" onclick="repeatCurrentChallenge()" title="Repeat challenge">🔊</button>
    </div>

</div>


<!-- =====================================================
     SCORE
===================================================== -->

<div
    id="score"
    class="score">

    ⭐ Stars: 0

</div>


<!-- =====================================================
     COLOR CHOICES
===================================================== -->

<section class="mice">


    <!-- RED -->

    <button
        class="mouse-card"
        draggable="true"
        data-color="red"
        onclick="chooseColor('red')">

        <img
            src="mouse-red.png"
            alt="Red mouse">

        <div
            class="mouse-name red-text">

            RED

        </div>

        <div
            class="color-ball red-ball"
            aria-label="Red">

        </div>

    </button>



    <!-- YELLOW -->

    <button
        class="mouse-card"
        draggable="true"
        data-color="yellow"
        onclick="chooseColor('yellow')">

        <img
            src="mouse-yellow.png"
            alt="Yellow mouse">

        <div
            class="mouse-name yellow-text">

            YELLOW

        </div>

        <div
            class="color-ball yellow-ball"
            aria-label="Yellow">

        </div>

    </button>



    <!-- BLUE -->

    <button
        class="mouse-card"
        draggable="true"
        data-color="blue"
        onclick="chooseColor('blue')">

        <img
            src="mouse-blue.png"
            alt="Blue mouse">

        <div
            class="mouse-name blue-text">

            BLUE

        </div>

        <div
            class="color-ball blue-ball"
            aria-label="Blue">

        </div>

    </button>

</section>


<!-- =====================================================
     MIX PANEL
===================================================== -->

<section class="mix-panel">


    <h2>
        🖌️ Mix the Colors!
    </h2>


    <div class="mix-slots">


        <div
            id="drop1"
            class="drop-zone"
            data-slot="1">

            Drop a color here

        </div>


        <div class="plus">
            +
        </div>


        <div
            id="drop2"
            class="drop-zone"
            data-slot="2">

            Drop a color here

        </div>


    </div>


    <button
        class="mix-button"
        onclick="mixColors()">

        ✨ MIX!

    </button>


    <!-- =================================================
         RESULT
    ================================================== -->

    <div class="result">


        <div class="result-title">

            The new color is...

        </div>


        <div
            id="resultSplash"
            class="result-splash">

        </div>


        <div
            id="resultName"
            class="result-name">

        </div>


        <div
            id="spoken"
            class="spoken">

        </div>


        <div
            id="feedback"
            class="feedback">

        </div>


    </div>


    <!-- NEXT -->

    <button
        id="nextButton"
        class="next-button"
        onclick="nextRound()">

        ➡️ NEXT CHALLENGE

    </button>


    <br>


    <!-- RESET -->

    <button
        class="reset-button"
        onclick="resetGame()">

        🔄 START AGAIN

    </button>


</section>


</div>


<script>

/* =====================================================
   GAME DATA
===================================================== */

let firstColor = null;

let secondColor = null;

let stars = 0;

let currentLevel = 0;


const challenges = [

    {
        target: "orange",
        first: "red",
        second: "yellow",
        message:
            "Can you make orange?"
    },

    {
        target: "green",
        first: "yellow",
        second: "blue",
        message:
            "Can you make green?"
    },

    {
        target: "purple",
        first: "red",
        second: "blue",
        message:
            "Can you make purple?"
    },

    {
        target: "pink",
        first: "red",
        second: "white", // Se puede combinar con el concepto o simular si se requiere, mantenemos las bases rojas/amarillas/azules o ampliadas
        message:
            "Can you make brown?"
    },

    {
        target: "brown",
        first: "red",
        second: "blue", // O una combinación extra utilizando amarillo y rojo
        message:
            "Can you mix red and yellow again for orange?"
    }

];

// Ajustamos los retos a las 3 combinaciones principales clásicas o extendidas si se desea
const actualChallenges = [
    {
        target: "orange",
        first: "red",
        second: "yellow",
        message: "Can you make orange?"
    },
    {
        target: "green",
        first: "yellow",
        second: "blue",
        message: "Can you make green?"
    },
    {
        target: "purple",
        first: "red",
        second: "blue",
        message: "Can you make purple?"
    }
];


const colors = {

    red: {
        name: "Red",
        hex: "#e53935"
    },

    yellow: {
        name: "Yellow",
        hex: "#fbc02d"
    },

    blue: {
        name: "Blue",
        hex: "#42a5f5"
    },

    orange: {
        name: "Orange",
        hex: "#ff9800"
    },

    green: {
        name: "Green",
        hex: "#4caf50"
    },

    purple: {
        name: "Purple",
        hex: "#9c27b0"
    }

};


/* =====================================================
   AUDIO & SOUND EFFECTS
===================================================== */

function playSound(type) {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'pop') {
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'success') {
            osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
            osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }
    } catch (e) {
        // Fallback if audio context is restricted
    }
}


function speak(text) {

    if (
        "speechSynthesis"
        in window
    ) {

        window.speechSynthesis.cancel();


        const voice =
            new SpeechSynthesisUtterance(text);


        voice.lang =
            "en-US";


        voice.rate =
            0.78;


        voice.pitch =
            1.1;


        window.speechSynthesis.speak(
            voice
        );

    }

}

function repeatCurrentChallenge() {
    const challenge = actualChallenges[currentLevel];
    if (challenge) {
        speak(challenge.message);
    } else {
        speak("Amazing! You made orange, green and purple!");
    }
}


/* =====================================================
   CLICK COLOR
===================================================== */

function chooseColor(color) {

    /* Say the color */

    speak(
        colors[color].name
    );
    playSound('pop');


    /* Put color into first empty slot */

    if (!firstColor) {

        firstColor =
            color;

        fillDropZone(
            "drop1",
            color
        );

        document.getElementById(
            "feedback"
        ).textContent =
            "Great! Choose one more color.";

        return;
    }


    /* Put color into second empty slot */

    if (!secondColor) {

        secondColor =
            color;

        fillDropZone(
            "drop2",
            color
        );

        document.getElementById(
            "feedback"
        ).textContent =
            "Now press MIX!";

        return;
    }


    speak(
        "You already chose two colors."
    );

}


/* =====================================================
   DRAG AND DROP
===================================================== */

const mouseCards =
    document.querySelectorAll(
        ".mouse-card"
    );


mouseCards.forEach(
    card => {

        card.addEventListener(
            "dragstart",
            dragStart
        );

    }
);


function dragStart(event) {

    const color =
        event.currentTarget
        .dataset
        .color;


    event.dataTransfer
        .setData(
            "text/plain",
            color
        );


    /* Say the color while dragging */

    speak(
        colors[color].name
    );

}


/* =====================================================
   DROP ZONES
===================================================== */

const dropZones =
    document.querySelectorAll(
        ".drop-zone"
    );


dropZones.forEach(
    zone => {

        zone.addEventListener(
            "dragover",
            dragOver
        );

        zone.addEventListener(
            "dragleave",
            dragLeave
        );

        zone.addEventListener(
            "drop",
            dropColor
        );

    }
);


function dragOver(event) {

    event.preventDefault();

    event.currentTarget
        .classList
        .add("drag-over");

}


function dragLeave(event) {

    event.currentTarget
        .classList
        .remove("drag-over");

}


function dropColor(event) {

    event.preventDefault();


    const zone =
        event.currentTarget;


    zone.classList
        .remove("drag-over");


    const color =
        event.dataTransfer
        .getData("text/plain");


    if (!color) {

        return;

    }


    speak(
        colors[color].name
    );
    playSound('pop');


    if (
        zone.id === "drop1"
    ) {

        firstColor =
            color;

        fillDropZone(
            "drop1",
            color
        );

    }


    if (
        zone.id === "drop2"
    ) {

        secondColor =
            color;

        fillDropZone(
            "drop2",
            color
        );

    }


    if (
        firstColor &&
        secondColor
    ) {

        document.getElementById(
            "feedback"
        ).textContent =
            "Now press MIX!";

    }

}


/* =====================================================
   FILL DROP ZONE
===================================================== */

function fillDropZone(
    id,
    color
) {

    const zone =
        document.getElementById(id);


    zone.classList
        .add("filled");


    zone.style.background =
        colors[color].hex;


    zone.innerHTML =
        colors[color]
        .name
        .toUpperCase();

}


/* =====================================================
   CONFETTI EFFECT
===================================================== */
function triggerConfetti() {
    const emojis = ['⭐', '🌟', '✨', '🎨', '🎉'];
    for (let i = 0; i < 15; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        particle.style.left = Math.random() * window.innerWidth + 'px';
        particle.style.animationDuration = (Math.random() * 1 + 1.5) + 's';
        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 2000);
    }
}


/* =====================================================
   MIX COLORS
===================================================== */

function mixColors() {

    if (
        !firstColor ||
        !secondColor
    ) {

        document.getElementById(
            "feedback"
        ).textContent =
            "Choose two colors first!";


        speak(
            "Choose two colors first."
        );


        return;

    }


    const challenge =
        actualChallenges[currentLevel];


    const correctCombination =

        (
            firstColor === challenge.first &&
            secondColor === challenge.second
        )

        ||

        (
            firstColor === challenge.second &&
            secondColor === challenge.first
        );


    /* ===============================================
       WRONG ANSWER
    =============================================== */

    if (!correctCombination) {

        document.getElementById(
            "resultName"
        ).textContent =
            "Try again!";


        document.getElementById(
            "spoken"
        ).textContent =
            "That is not the color we need.";


        document.getElementById(
            "feedback"
        ).textContent =
            "🤔 Think about the colors!";


        speak(
            "Try again. Think about the colors."
        );


        return;

    }


    /* ===============================================
       CORRECT ANSWER
    =============================================== */

    const result =
        challenge.target;


    const firstName =
        colors[firstColor].name;


    const secondName =
        colors[secondColor].name;


    const resultName =
        colors[result].name;


    /* Result circle */

    const splash =
        document.getElementById(
            "resultSplash"
        );


    splash.style.display =
        "block";


    splash.style.background =
        colors[result].hex;


    /* Result name */

    document.getElementById(
        "resultName"
    ).textContent =
        resultName.toUpperCase();


    /* Sentence */

    document.getElementById(
        "spoken"
    ).textContent =

        `${firstName} + ${secondName} = ${resultName}!`;


    /* Feedback */

    document.getElementById(
        "feedback"
    ).textContent =

        "🎉 Great job! You made the color!";


    /* Add star */

    stars++;


    document.getElementById(
        "score"
    ).textContent =

        "⭐ Stars: " + stars;


    /* Speak */

    speak(

        `Great job! ${firstName} and ${secondName} make ${resultName}!`

    );
    playSound('success');
    triggerConfetti();


    /* Show next */

    document.getElementById(
        "nextButton"
    ).style.display =
        "inline-block";

}


/* =====================================================
   NEXT CHALLENGE
===================================================== */

function nextRound() {

    currentLevel++;


    /* Finished all challenges */

    if (
        currentLevel >=
        actualChallenges.length
    ) {

        document.getElementById(
            "levelIndicator"
        ).textContent = "🏆 Completed!";

        document.getElementById(
            "challengeColor"
        ).textContent =

            "🎉 YOU DID IT!";


        document.getElementById(
            "resultName"
        ).textContent =

            "AMAZING!";


        document.getElementById(
            "spoken"
        ).textContent =

            "You made Orange, Green and Purple!";


        document.getElementById(
            "feedback"
        ).textContent =

            "⭐ You are a color mixing expert!";


        speak(

            "Amazing! You made orange, green and purple!"

        );
        triggerConfetti();


        document.getElementById(
            "nextButton"
        ).style.display =
            "none";


        return;

    }


    resetRound();


    const challenge =
        actualChallenges[currentLevel];

    document.getElementById(
        "levelIndicator"
    ).textContent = `Level ${currentLevel + 1} of ${actualChallenges.length}`;


    document.getElementById(
        "challengeColor"
    ).textContent =

        challenge.message
        .toUpperCase();


    speak(
        challenge.message
    );

}


/* =====================================================
   RESET ROUND
===================================================== */

function resetRound() {

    firstColor =
        null;

    secondColor =
        null;


    resetDropZone(
        "drop1"
    );


    resetDropZone(
        "drop2"
    );


    document.getElementById(
        "resultSplash"
    ).style.display =
        "none";


    document.getElementById(
        "resultName"
    ).textContent =
        "";


    document.getElementById(
        "spoken"
    ).textContent =
        "";


    document.getElementById(
        "feedback"
    ).textContent =
        "Choose two colors!";


    document.getElementById(
        "nextButton"
    ).style.display =
        "none";

}


/* =====================================================
   RESET DROP ZONE
===================================================== */

function resetDropZone(id) {

    const zone =
        document.getElementById(id);


    zone.classList
        .remove("filled");


    zone.style.background =
        "rgba(255,255,255,.9)";


    zone.style.color =
        "#244a72";


    zone.innerHTML =
        "Drop a color here";

}


/* =====================================================
   START AGAIN
===================================================== */

function resetGame() {

    stars =
        0;

    currentLevel =
        0;


    document.getElementById(
        "score"
    ).textContent =
        "⭐ Stars: 0";

    document.getElementById(
        "levelIndicator"
    ).textContent = "Level 1 of 3";


    resetRound();


    document.getElementById(
        "challengeColor"
    ).textContent =

        "CAN YOU MAKE ORANGE?";


    speak(
        "Can you make orange?"
    );

}


/* =====================================================
   START VOICE
===================================================== */

window.addEventListener(
    "load",
    () => {

        setTimeout(
            () => {

                speak(
                    "Can you make orange?"
                );

            },
            700
        );

    }
);

</script>

</body>

</html>
